services:
    portatec:
        image: portatec
        dns:
            - 9.9.9.9
            - 8.8.8.8
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        # Nenhuma porta publicada: quem fala com este container é o nginx do
        # medeirostec, pela rede medeirostec-network, por nome de serviço. A
        # 5173 que ficava aqui é a do servidor de desenvolvimento do Vite —
        # aberta na VPS, sem nada escutando.
        environment:
            WWWUSER: '${WWWUSER}'
        volumes:
            - './.env:/var/www/.env'
            - './database.sqlite:/var/www/database/database.sqlite'
            - './storage:/var/www/storage'
        networks:
            - medeirostec-network
        depends_on:
            redis:
                condition: service_healthy
        restart: always
        # 472 MB observados em produção; o teto existe para um vazamento aqui
        # ser contido neste container em vez de sorteado pelo OOM killer entre
        # todos os da VPS — inclusive o mysql do biolitoral.
        mem_limit: 768m
        healthcheck:
            # /up é a rota de saúde que o bootstrap/app.php já expõe, servida
            # pelo nginx interno. Cobre nginx e php-fpm; NÃO cobre os outros
            # cinco processos do supervisor, que seguem invisíveis ao docker ps.
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s


    redis:
        image: 'redis:alpine'
        volumes:
            - 'portatec-redis:/data'
        networks:
            - medeirostec-network
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 2s
            timeout: 5s
            retries: 3
        restart: always

    mosquitto:
        image: eclipse-mosquitto:2
        volumes:
            - './mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf'
            - './mosquitto/auth/passwd:/etc/mosquitto/passwd'
            - 'portatec-mosquitto-data:/mosquitto/data'
            - 'portatec-mosquitto-log:/mosquitto/log'
        ports:
            - '1883:1883'
            - '9001:9001'
        networks:
            - medeirostec-network
        restart: always

networks:
  medeirostec-network:
      external: true
      name: medeirostec-network
      driver: bridge

volumes:
    portatec-redis:
        driver: local
    portatec-mosquitto-data:
        driver: local
    portatec-mosquitto-log:
        driver: local
